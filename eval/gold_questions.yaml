  question: For each terminal, how many port calls completed and how many were cancelled?
  ordered: false
  note: "Conditional aggregation with FILTER; the two-measures-in-one-row shape (behaviour multi_part)."
  topics: [48, 50, 71]
  behaviour: multi_part
  gold_sql: |
    SELECT t.terminal_name,
           COUNT(*) FILTER (WHERE pc.status = 'completed') AS completed_calls,
           COUNT(*) FILTER (WHERE pc.status = 'cancelled') AS cancelled_calls
    FROM port_calls pc
    JOIN terminals t ON t.terminal_id = pc.terminal_id
    GROUP BY t.terminal_name
    ORDER BY t.terminal_name

- id: q42
  category: answerable
  question: What is the average number of port calls per terminal?
