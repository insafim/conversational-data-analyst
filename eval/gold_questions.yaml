# --- beyond-catalog tranche, 2026-08-10, after baseline runs 15-17 -----------------
# Constructs absent from the 75-topic syllabus that the validator admits and the data
# can discriminate. Verified live 2026-08-10 before the baseline runs; added after them
# so runs 15-17 measured a frozen 100-case set. See ADR-010's addendum.

- id: q71
  category: answerable
  question: Which vessels had a cancelled port call at both Jebel Ali Terminal 2 and Rotterdam Delta Terminal?
  ordered: false
  note: "INTERSECT, beyond the syllabus. Exercises the validator's SetOperation allowlist decision (src/validator.py:57-64) end to end. Exactly 2 vessels qualify, so the set operation discriminates."
  topics: []
  behaviour: comparative
  gold_sql: |
    SELECT v.vessel_name
    FROM vessels v
    JOIN port_calls pc ON pc.vessel_id = v.vessel_id
    JOIN terminals t ON t.terminal_id = pc.terminal_id
    WHERE t.terminal_name = 'Jebel Ali Terminal 2' AND pc.status = 'cancelled'
    INTERSECT
    SELECT v.vessel_name
    FROM vessels v
    JOIN port_calls pc ON pc.vessel_id = v.vessel_id
