- id: q58
  category: answerable
  question: What were the three busiest months for container volume?
  ordered: true
  note: "CTE plus explicit count (topic 70; LIMIT 3 per grammar rule). Oct, Aug, Sep 2025; values distinct so the cut is deterministic."
  topics: [70, 46, 35, 36]
  behaviour: comparative
  gold_sql: |
    WITH monthly AS (
        SELECT date_trunc('month', cm.move_ts)::date AS month,
               SUM(cm.container_count) AS total_containers
        FROM cargo_moves cm
        GROUP BY 1
    )
    SELECT month, total_containers
    FROM monthly
    ORDER BY total_containers DESC
    LIMIT 3

- id: q59
  category: answerable
  question: Classify the fleet by size, small under 10000 TEU, medium 10000 to 15000, large above 15000, and count each class.
  ordered: false
  note: "CASE (topic 71) with bands DEFINED IN THE QUESTION, unlike run4 q23 where the agent invented bands. small 20, large 16, medium 4."
  topics: [71, 48, 50]
  behaviour: happy_path
  gold_sql: |
    SELECT CASE
             WHEN capacity_teu < 10000 THEN 'small'
             WHEN capacity_teu <= 15000 THEN 'medium'
             ELSE 'large'
           END AS size_class,
           COUNT(*) AS vessel_count
    FROM vessels
    GROUP BY 1
    ORDER BY vessel_count DESC

- id: q60
  category: answerable
  question: For each terminal, which quarter of 2025 was its worst for average berth wait?
  ordered: false
  note: "Window extension block: RANK partitioned per terminal, the q26-A exercise from study guide section 6. Jebel Ali worst in Q4 at 19.55."
  topics: [70, 51]
  behaviour: comparative
  gold_sql: |
    WITH quarterly AS (
        SELECT t.terminal_name,
               date_trunc('quarter', pc.arrival_ts)::date AS quarter,
               AVG(pc.berth_wait_hours) AS avg_wait,
               RANK() OVER (PARTITION BY t.terminal_name ORDER BY AVG(pc.berth_wait_hours) DESC) AS rnk
        FROM port_calls pc
        JOIN terminals t ON t.terminal_id = pc.terminal_id
        WHERE pc.arrival_ts >= DATE '2025-01-01' AND pc.arrival_ts < DATE '2026-01-01'
        GROUP BY 1, 2
    )
    SELECT terminal_name, quarter, ROUND(avg_wait, 2) AS avg_berth_wait_hours
    FROM quarterly
    WHERE rnk = 1
    ORDER BY terminal_name

- id: q61
  category: answerable
  question: Show each month's container total at Rotterdam Delta Terminal during 2025 alongside the running total to date.
  ordered: true
  note: "Window extension block: explicit ROWS BETWEEN frame scoped to one terminal, the q27-A shape. Ends at 36125. Reworded 2026-08-10: the original phrasing ('running total, month by month') did not compel the monthly column, and the agent's two-column answer was defensible; the wording now names both columns, mirroring q27's."
  topics: [70, 46, 33]
  behaviour: happy_path
  gold_sql: |
    WITH monthly AS (
        SELECT date_trunc('month', cm.move_ts)::date AS month,
               SUM(cm.container_count) AS monthly_containers
        FROM cargo_moves cm
        JOIN port_calls pc ON pc.port_call_id = cm.port_call_id
        JOIN terminals t ON t.terminal_id = pc.terminal_id
        WHERE t.terminal_name = 'Rotterdam Delta Terminal'
          AND cm.move_ts >= DATE '2025-01-01' AND cm.move_ts < DATE '2026-01-01'
        GROUP BY 1
    )
    SELECT month, monthly_containers,
           SUM(monthly_containers) OVER (ORDER BY month ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_total
    FROM monthly
    ORDER BY month

- id: q62
  category: answerable
  question: How did the number of port calls change month over month during 2025?
  ordered: true
  note: "Window extension block: LAG on call counts, the q28 shape on a different measure. First row's change is NULL, the groundedness trap again."
  topics: [70, 29]
  behaviour: edge_data
  gold_sql: |
    WITH monthly AS (
        SELECT date_trunc('month', arrival_ts)::date AS month, COUNT(*) AS call_count
        FROM port_calls
        WHERE arrival_ts >= DATE '2025-01-01' AND arrival_ts < DATE '2026-01-01'
        GROUP BY 1
    )
    SELECT month, call_count,
           call_count - LAG(call_count) OVER (ORDER BY month) AS change_from_prior
    FROM monthly
    ORDER BY month

- id: q63
  category: answerable
  question: Compare containers loaded versus discharged at each terminal.
  ordered: false
  note: "Per-terminal split of q12's total, via FILTER. Every terminal discharges more than it loads, which is the planted imbalance."
  topics: [46, 50, 61]
