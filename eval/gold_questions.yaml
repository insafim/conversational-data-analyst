- id: q04
  category: answerable
  question: Show the total number of containers moved each month during 2025.
  ordered: true
  note: "Planted pattern 2: February trough, autumn peak. Should render as a line chart."
  topics: [46, 50, 26, 28, 34, 35]
  behaviour: happy_path
  gold_sql: |
    SELECT DATE_TRUNC('month', cm.move_ts)::date AS month,
           SUM(cm.container_count) AS total_containers
    FROM cargo_moves cm
    WHERE cm.move_ts >= DATE '2025-01-01'
      AND cm.move_ts < DATE '2026-01-01'
    GROUP BY 1
    ORDER BY 1

- id: q05
  category: answerable
  question: Which shipping operator waits longest for a berth on average?
  ordered: true
  note: "Planted pattern 4: Meridian Lines."
  topics: [47, 61, 50, 35, 36]
  behaviour: comparative
  gold_sql: |
    SELECT v.operator,
           ROUND(AVG(pc.berth_wait_hours), 2) AS avg_berth_wait_hours
    FROM port_calls pc
    JOIN vessels v ON v.vessel_id = pc.vessel_id
    GROUP BY v.operator
    ORDER BY avg_berth_wait_hours DESC
    LIMIT 1

- id: q06
  category: answerable
  question: Which crane at Rotterdam moves the fewest containers per hour?
  ordered: true
  note: "Planted pattern 3: RTM-QC-01. Three-table join with a derived rate."
  topics: [61, 50, 35, 36]
  behaviour: comparative
  gold_sql: |
    SELECT c.crane_code,
           ROUND(SUM(cm.container_count) / (SUM(cm.duration_minutes) / 60.0), 2) AS containers_per_hour
    FROM cargo_moves cm
    JOIN cranes c ON c.crane_id = cm.crane_id
    JOIN terminals t ON t.terminal_id = c.terminal_id
    WHERE t.port_name = 'Rotterdam'
    GROUP BY c.crane_code
    ORDER BY containers_per_hour ASC
    LIMIT 1

