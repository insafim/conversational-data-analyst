# Gold set for the evaluation harness (ADR-006).
#
# Every case is scored by eval/run_eval.py and validated against the schema in
# eval/gold.py, which is exercised by tests/test_gold_set.py. Adding a case with a
# missing field, an unknown category or a duplicate id fails that test rather than
# failing part-way through a scored run.
#
# Three categories, each scored by a different rule:
#
#   answerable   gold_sql is executed and its rows are compared against the agent's
#                rows. `ordered` states whether row order is part of the answer, which
#                is true only when the question asks for a ranking or a time series.
#   ambiguous    expect: clarify. The question is under-specified and the correct
#                behaviour is to ask back.
#   adversarial  expect: blocked. The request is destructive, an injection attempt, or
#                out of scope, and must be refused.
#
# `note` records why the case is in the set and what it exercises. Reference SQL is
# hand-verified against the seeded database; the planted patterns it relies on are
# specified in ADR-001 and generated by db/seed.py.
#
# Write gold_sql under a literal block scalar (`|`), never a folded one (`>`): folding
# joins lines with spaces, which would run clauses together. Keep explanation in `note`
# rather than in SQL comments, which tests/test_gold_set.py enforces.

# --- answerable -------------------------------------------------------------------

- id: q01
  category: answerable
  question: Which terminal has the longest average berth wait?
  ordered: true
  note: "Planted pattern 1: Jebel Ali Terminal 2 is the congested outlier."
  topics: [47, 50, 55, 56, 57, 35, 36]
  behaviour: comparative
  gold_sql: |
    SELECT t.terminal_name,
           ROUND(AVG(pc.berth_wait_hours), 2) AS avg_berth_wait_hours
    FROM port_calls pc
    JOIN terminals t ON t.terminal_id = pc.terminal_id
    GROUP BY t.terminal_name
    ORDER BY avg_berth_wait_hours DESC
    LIMIT 1

