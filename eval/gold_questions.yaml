           SUM(cm.container_count) FILTER (WHERE cm.move_type = 'load') AS loaded,
           SUM(cm.container_count) FILTER (WHERE cm.move_type = 'discharge') AS discharged
    FROM cargo_moves cm
    JOIN port_calls pc ON pc.port_call_id = cm.port_call_id
    JOIN terminals t ON t.terminal_id = pc.terminal_id
    GROUP BY t.terminal_name
    ORDER BY t.terminal_name

- id: q64
  category: answerable
  question: Give me a profile of Rotterdam Delta Terminal, its total port calls, average berth wait, and crane count.
  ordered: false
