    SELECT
      (SELECT COUNT(*) FROM port_calls pc JOIN terminals t ON t.terminal_id = pc.terminal_id
       WHERE t.terminal_name = 'Rotterdam Delta Terminal') AS port_calls,
      (SELECT ROUND(AVG(pc.berth_wait_hours), 2) FROM port_calls pc JOIN terminals t ON t.terminal_id = pc.terminal_id
       WHERE t.terminal_name = 'Rotterdam Delta Terminal') AS avg_berth_wait_hours,
